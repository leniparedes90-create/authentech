  to = "/#checkout-autodesk"
  status = 302

[[redirects]]
  from = "/checkout-eset-nod32"
  to = "/#checkout-eset-nod32"
  status = 302

# SPA fallback - MUST be last, NO force
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
